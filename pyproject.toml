[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk-sanitizer"
version = "0.1.0"
description = "Scan Android apps (APK/source) for hidden SDK trackers and privacy (GDPR/CCPA) risks. CLI + GitHub Action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DuminAndrew" }]
keywords = ["android", "privacy", "gdpr", "ccpa", "trackers", "sdk", "static-analysis", "sarif"]
dependencies = []

[project.optional-dependencies]
apk = ["androguard>=4.1.0"]
update = ["requests>=2.31.0"]

[project.scripts]
sdk-sanitizer = "sdk_sanitizer.cli:main"

[tool.setuptools]
packages = ["sdk_sanitizer"]
