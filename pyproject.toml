[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk-sanitizer"
version = "0.1.0"
description = "Scan Android apps (APK/source) for hidden SDK trackers and privacy (GDPR/CCPA) risks. CLI + GitHub Action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DuminAndrew" }]
keywords = ["android", "privacy", "gdpr", "ccpa", "trackers", "sdk", "static-analysis", "sarif"]
dependencies = []

[project.optional-dependencies]
apk = ["androguard>=4.1.0"]
update = ["requests>=2.31.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/DuminAndrew/SDK-Sanitizer"
Repository = "https://github.com/DuminAndrew/SDK-Sanitizer"
Issues = "https://github.com/DuminAndrew/SDK-Sanitizer/issues"
Changelog = "https://github.com/DuminAndrew/SDK-Sanitizer/blob/main/CHANGELOG.md"

[project.scripts]
sdk-sanitizer = "sdk_sanitizer.cli:main"

[tool.setuptools]
packages = ["sdk_sanitizer"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
